# Netlify reads this file automatically (Import from Git) - no dashboard settings needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+; 22 satisfies "Node 20+".
  NODE_VERSION = "22"

# Cache headers live in public/_headers (copied into dist/), so they also apply to
# a drag-and-drop deploy of dist/.
