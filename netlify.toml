# Netlify reads this file automatically (Import from Git) - no dashboard settings needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+; 22 satisfies "Node 20+".
  NODE_VERSION = "22"

# Hashed build output: safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos keep their file names when replaced, so cache for 30 days (not "immutable").
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
